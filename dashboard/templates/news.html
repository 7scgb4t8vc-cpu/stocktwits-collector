{% extends "base.html" %}
{% block content %}
<style>
#news-table {
  table-layout: fixed;
  width: 100%;
}
#news-table td:nth-child(3) {
  overflow-x: auto;
  white-space: nowrap;
  display: block;
}
</style>
<div class="page-header">
  <h1>News</h1>
  <p class="page-subtitle">Latest StockTwits activity across your watchlist</p>
</div>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:0.75rem;">
  <label style="font-size:11px;color:var(--muted);font-weight:600;">REFRESH EVERY</label>
  <select id="refresh-interval-select" class="filter-select">
    <option value="15000">15s</option>
    <option value="30000">30s</option>
    <option value="60000" selected>1 min</option>
    <option value="300000">5 min</option>
    <option value="0">Off</option>
  </select>
</div>
<div class="filter-bar">
  <input type="text" id="filter-symbol" placeholder="Filter by symbol (e.g. NVDA)" class="filter-input" />
  <select id="filter-sentiment" class="filter-select">
    <option value="">All sentiment</option>
    <option value="bullish">Bullish</option>
    <option value="bearish">Bearish</option>
    <option value="neutral">Neutral</option>
    <option value="mixed">Mixed</option>
  </select>
  <button class="btn-refresh" onclick="loadNews()">↻ Refresh now</button>
</div>

<div class="stats-bar">
  <div class="stat-chip"><span id="stat-total">—</span> items</div>
</div>

<div class="table-wrap">
  <table class="data-table" id="news-table">
    <colgroup>
      <col style="width:140px">
      <col style="width:80px">
      <col style="width:600px">
      <col style="width:100px">
      <col style="width:70px">
      <col style="width:70px">
      <col style="width:80px">
    </colgroup>
    <thead>
      <tr>
        <th data-key="timestamp">Time</th>
        <th data-key="symbol">Ticker</th>
        <th data-key="message">Headline</th>
        <th data-key="nlp_label">Sentiment</th>
        <th data-key="nlp_score">Score</th>
        <th data-key="likes">Likes</th>
        <th data-key="reshares">Reshares</th>
      </tr>
    </thead>
    <tbody id="news-body">
      <tr><td colspan="7" class="loading">Loading news...</td></tr>
    </tbody>
  </table>
</div>

{% endblock %}

{% block scripts %}
<script>
let allNews = [];
let sortKey = "timestamp";
let sortDir = -1;

async function loadNews() {
  const body = document.getElementById("news-body");
  body.innerHTML = '<tr><td colspan="7" class="loading">Loading...</td></tr>';

  try {
    const res = await fetch("/api/social");
    allNews = await res.json();
    applyFilters();
  } catch (e) {
    body.innerHTML = '<tr><td colspan="7" class="error">Failed to load data.</td></tr>';
  }
}

function applyFilters() {
  const symbol    = document.getElementById("filter-symbol").value.trim().toUpperCase();
  const sentiment = document.getElementById("filter-sentiment").value.toLowerCase();

  let rows = allNews;

  if (symbol) {
    rows = rows.filter(r => r.symbol === symbol);
  }
  if (sentiment) {
    rows = rows.filter(r => (r.nlp_label || "").toLowerCase() === sentiment);
  }

  rows = rows.slice().sort((a, b) => {
    let av = a[sortKey] ?? "";
    let bv = b[sortKey] ?? "";
    if (sortKey === "nlp_score") {
      av = parseFloat(av) || 0;
      bv = parseFloat(bv) || 0;
    }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });

  document.getElementById("stat-total").textContent = rows.length;

  const body = document.getElementById("news-body");
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">No news found.</td></tr>';
    return;
  }

  body.innerHTML = rows.map(r => {
    const label = (r.nlp_label || "neutral").toLowerCase();
    const rawScore = r.nlp_score ? parseFloat(r.nlp_score) : null;
    let signedScore = rawScore;
    if (rawScore !== null) {
      if (label === "bearish") signedScore = -Math.abs(rawScore);
      else if (label === "bullish") signedScore = Math.abs(rawScore);
      else signedScore = 0;
    }
    const score = signedScore !== null ? (signedScore > 0 ? "+" : "") + signedScore.toFixed(2) : "—";
    return `
      <tr class="sentiment-${label}">
        <td>${formatTimestamp12h(r.timestamp)}</td>
        <td><a class="ticker-badge ticker-link" href="/charts?symbol=${r.symbol}">${r.symbol}</a></td>
        <td>${escapeHtml(r.message)}</td>
        <td><span class="sentiment-badge badge-${label}">${label}</span></td>
        <td>${score}</td>
        <td>${r.likes || 0}</td>
        <td>${r.reshares || 0}</td>
      </tr>`;
  }).join("");
}

function escapeHtml(text) {
  const txt = document.createElement("textarea");
  txt.innerHTML = String(text);
  return txt.value;
}

function formatTimestamp12h(ts) {
  if (!ts) return ts;
  const match = ts.match(/^(\d{4}-\d{2}-\d{2}) (\d{2}):(\d{2})(.*)$/);
  if (!match) return ts;
  const [, date, hh, mm, rest] = match;
  let hour = parseInt(hh, 10);
  const ampm = hour >= 12 ? "PM" : "AM";
  hour = hour % 12 || 12;
  return `${date} ${hour}:${mm} ${ampm}${rest}`;
}

document.getElementById("filter-symbol").addEventListener("input", applyFilters);
document.getElementById("filter-sentiment").addEventListener("change", applyFilters);
document.querySelectorAll("#news-table thead th").forEach(th => {
  th.style.cursor = "pointer";
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = -1; }
    applyFilters();
  });
});

let _refreshInterval = null;
function startAutoRefresh(intervalMs) {
  if (_refreshInterval) clearInterval(_refreshInterval);
  if (!intervalMs || intervalMs <= 0) return;
  _refreshInterval = setInterval(loadNews, intervalMs);
}
document.getElementById("refresh-interval-select").addEventListener("change", (e) => {
  startAutoRefresh(parseInt(e.target.value));
});
startAutoRefresh(60000);

window.registerPageLoader(loadNews);
</script>
{% endblock %}
