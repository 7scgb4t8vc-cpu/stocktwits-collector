name: Reset Stuck Sentiment (one-off)
   "on": workflow_dispatch

   jobs:
     reset:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: pip install pymongo certifi
         - run: python reset_stuck_sentiment.py
           env:
             MONGO_URI: ${{ secrets.MONGO_URI }}
